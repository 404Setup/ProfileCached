modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL = "https://api.modrinth.com/updates/profile-cached/forge_updates.json" #optional
displayURL = "https://modrinth.com/project/profile-cached"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "ProfileCached.jpg"
[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "SERVER"
[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "AFTER"
side = "SERVER"
